name: study_bd
description: Study BD - Bangladesh National Curriculum, admission, English, IELTS and job preparation app.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State / routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  cloud_functions: ^5.1.3
  google_sign_in: ^6.2.1

  # Monetization
  google_mobile_ads: ^5.2.0

  # Content: PDF / video / images / downloads
  pdfx: ^2.8.0
  video_player: ^2.9.1
  chewie: ^1.8.5
  youtube_player_flutter: ^9.0.3
  cached_network_image: ^3.4.1
  dio: ^5.7.0
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  url_launcher: ^6.3.1

  # Utilities
  shared_preferences: ^2.3.2
  intl: any
  uuid: ^4.5.1
  connectivity_plus: ^6.0.5
  flutter_local_notifications: ^17.2.3
  fl_chart: ^0.69.0
  table_calendar: ^3.1.2
  pdf: ^3.11.1
  printing: ^5.13.3

  # Device features
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  speech_to_text: ^7.0.0
  flutter_tts: ^4.1.0
  record: ^5.1.2
  mobile_scanner: ^5.2.3
  google_mlkit_text_recognition: ^0.13.1
  google_mlkit_document_scanner: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#0B7A4B"
  adaptive_icon_foreground: "assets/icons/app_icon_fg.png"
